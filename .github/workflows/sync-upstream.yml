name: Sync Upstream (Safe Merge, Keep Our Workflows)

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://git.decemm.cn/hank/86JP.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream changes (excluding .github/workflows)
        run: |
          git checkout main
          # 执行合并，但不自动提交
          git merge upstream/main --allow-unrelated-histories -X ours --no-commit

          # 如果有冲突或新增文件，我们强制恢复 .github/workflows 目录到合并前的状态
          # 这样就不会引入上游的工作流文件
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true

          # 如果该目录不存在于当前版本，则跳过
          # 提交合并
          git commit -m "Merge upstream changes, keep our workflows" || echo "No changes to commit"

          # 推送到远程
          git push origin main

name: Sync Upstream (Safe Merge)

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      # 设置 Git 用户身份，以便创建合并提交
      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://git.decemm.cn/hank/86JP.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream changes (keep our workflow files)
        run: |
          git checkout main
          # 使用 -X ours 策略，如果发生冲突，保留当前分支（ours）的版本
          # 这样你的工作流文件就不会被源仓库覆盖
          git merge upstream/main --allow-unrelated-histories -X ours
          git push origin main
